# Configuração do editor visual (Decap CMS).
# Quem pode editar = quem tem acesso de escrita ao repositório no GitHub.

backend:
  name: github
  repo: leandrocrodrigues-code/vd-docs   # trocar pelo repo da TOTVS na migração
  branch: main
  # Serviço de login (OAuth). Ver README → "Login do editor".
  base_url: https://TROCAR-PELO-SEU-WORKER.workers.dev
  commit_messages:
    create: 'docs: cria "{{slug}}" ({{author-login}})'
    update: 'docs: atualiza "{{slug}}" ({{author-login}})'
    delete: 'docs: remove "{{slug}}" ({{author-login}})'
    uploadMedia: 'docs: envia {{path}}'
    deleteMedia: 'docs: remove {{path}}'

# Rascunho → Em revisão → Pronto pra publicar. Nada vai pro ar sem aprovação.
publish_mode: editorial_workflow

# Pra testar no próprio computador sem login: npm run cms + npm start
local_backend: true

locale: pt
site_url: https://leandrocrodrigues-code.github.io/vd-docs/
display_url: https://leandrocrodrigues-code.github.io/vd-docs/
logo_url: /vd-docs/img/logo.svg

media_folder: static/img/uploads
public_folder: /img/uploads

collections:
  # Vida DS
  - name: componentes
    label: 'Vida DS · Componentes'
    label_singular: Componente
    folder: docs/vida-ds/componentes
    create: true
    delete: true
    extension: mdx
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: ['title', 'sidebar_position']
    fields: &campos
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Nome no menu', name: 'sidebar_label', widget: 'string', required: false, hint: 'Se vazio, usa o título.' }
      - { label: 'Resumo (aparece na busca)', name: 'description', widget: 'string', required: false }
      - { label: 'Ordem no menu', name: 'sidebar_position', widget: 'number', value_type: 'int', required: false, hint: 'Número menor aparece primeiro.' }
      - { label: 'Conteúdo', name: 'body', widget: 'markdown', modes: ['rich_text', 'raw'], editor_components: ['image', 'code-block', 'figma', 'storybook'] }

  - name: estilos
    label: 'Vida DS · Estilos'
    label_singular: Estilo
    folder: docs/vida-ds/estilos
    create: false
    filter: { field: 'title', pattern: '^(?!Cores$|Tipografia$|Espaçamento).*' }
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields: *campos

  - name: tokens
    label: 'Vida DS · Tokens'
    folder: docs/vida-ds/tokens
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields: *campos

  - name: comportamentos
    label: 'Vida DS · Comportamentos'
    folder: docs/vida-ds/comportamentos
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields: *campos

  # Nosso Time
  - name: nosso-time
    label: 'Nosso Time'
    label_singular: Página
    folder: docs/nosso-time
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields: *campos

  # Research Ops
  - name: research-ops
    label: 'Research Ops'
    label_singular: Página
    folder: docs/research-ops
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields: *campos

  # Guias
  - name: guias
    label: Guias
    label_singular: Guia
    folder: docs/guias
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields: *campos

  - name: templates
    label: 'Guias · Templates de tela'
    label_singular: Template
    folder: docs/guias/templates
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields: *campos
